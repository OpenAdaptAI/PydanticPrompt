name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Run workflow on version tags
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest-cov
        
    - name: Run linting and type checking
      run: |
        chmod +x ./lint.sh
        ./lint.sh
        
    - name: Test with pytest
      run: |
        pytest --cov=pydantic_prompt --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build and check package
      run: |
        python -m build
        twine check dist/*
        
    # Pinned to a commit SHA, not the floating release/v1 tag, so an upstream
    # change cannot alter a release with no commit here. v1.14.2 bundles twine
    # 7.0.0 and packaging 26.2, which accept the Metadata-Version 2.5 that current
    # hatchling emits. v1.14.0 rejected it and broke the openadapt-evals 0.91.0
    # publish after the tag had already landed.
    - name: Publish to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
